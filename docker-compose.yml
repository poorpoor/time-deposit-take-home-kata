services:
  postgres:
    image: postgres:16-alpine
    container_name: time-deposit-postgres
    environment:
      POSTGRES_DB: timedeposits
      POSTGRES_USER: timedeposits
      POSTGRES_PASSWORD: timedeposits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedeposits -d timedeposits"]
      interval: 5s
      timeout: 5s
      retries: 5
